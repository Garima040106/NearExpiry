
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | NearExpiry</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-wrapper">
        <div class="auth-card">

            <a href="index.html" class="brand text-decoration-none">
                NearExpiry<span>.</span>
            </a>

            <div class="auth-heading mt-4">
                <h1>Create your account</h1>
                <p>Join the medicine-sharing network.</p>
            </div>

            <div id="authMessage" class="alert d-none" role="alert"></div>

            <form id="registerForm">

                <div class="mb-3">
                    <label for="name" class="form-label">Full name</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label">Account role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="">Select your role</option>
                        <option value="staff">Staff</option>
                        <option value="pharmacist">Pharmacist</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="facility" class="form-label">Healthcare facility</label>
                    <select
                        class="form-select"
                        id="facility"
                        name="facility"
                        required
                    >
                        <option value="">Loading facilities...</option>
                    </select>
                </div>

                <button
                    type="submit"
                    id="registerButton"
                    class="btn btn-primary-custom w-100"
                >
                    Create account
                </button>

            </form>

            <p class="auth-footer mt-4">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
