
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NearExpiry</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-wrapper">
        <div class="auth-card">

            <a href="index.html" class="brand text-decoration-none">
                NearExpiry<span>.</span>
            </a>

            <div class="auth-heading mt-4">
                <h1>Welcome back</h1>
                <p>Sign in to manage your medicine inventory.</p>
            </div>

            <div id="authMessage" class="alert d-none" role="alert"></div>

            <form id="loginForm">

                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="btn btn-primary-custom w-100"
                >
                    Sign in
                </button>

            </form>

            <p class="auth-footer mt-4">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
